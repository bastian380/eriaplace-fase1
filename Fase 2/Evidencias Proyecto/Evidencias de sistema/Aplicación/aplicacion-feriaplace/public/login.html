<title>Iniciar sesión - FeriaPlace</title>
<link rel="stylesheet" href="css/style.css">
<header>
  <a href="index.html">FeriaPlace</a>
  <nav id="nav-sesion"></nav>
</header>
<main>
  <div class="tarjeta" style="max-width:420px;margin:0 auto;">
    <h2>Iniciar sesión</h2>
    <form id="form-login">
      <label for="email">Email</label>
      <input type="email" id="email" required>
      <label for="password">Contraseña</label>
      <input type="password" id="password" required>
      <button type="submit">Ingresar</button>
    </form>
    <div id="mensaje"></div>
    <p style="margin-top:16px;font-size:0.9rem;">¿No tienes cuenta? <a href="registro.html" id="enlace-registro">Regístrate aquí</a></p>
  </div>
</main>
<script src="js/api.js"></script>
<script src="js/login.js"></script>
