<title>Mi cuenta - FeriaPlace</title>
<link rel="stylesheet" href="css/style.css">
<header>
  <a href="index.html">FeriaPlace</a>
  <nav id="nav-sesion"></nav>
</header>
<main>
  <div class="tarjeta" style="max-width:420px;margin:0 auto;">
    <h2>Cambiar contraseña</h2>
    <p class="texto-suave">La contraseña nueva debe tener al menos 8 caracteres.</p>
    <form id="form-clave">
      <label for="actual">Contraseña actual</label>
      <input type="password" id="actual" autocomplete="current-password" required>
      <label for="nueva">Contraseña nueva</label>
      <input type="password" id="nueva" minlength="8" autocomplete="new-password" required>
      <label for="repetir">Repite la contraseña nueva</label>
      <input type="password" id="repetir" minlength="8" autocomplete="new-password" required>
      <button type="submit">Guardar contraseña</button>
    </form>
    <div id="mensaje"></div>
  </div>
</main>
<script src="js/api.js"></script>
<script src="js/cuenta.js"></script>
