<!DOCTYPE html>
<html lang="es">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mi cuenta - FeriaPlace</title>
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<meta name="theme-color" content="#1f6f4f">
<link rel="stylesheet" href="css/style.css">
<header>
  <a href="index.html">FeriaPlace</a>
  <nav id="nav-sesion"></nav>
</header>
<main>
  <div class="tarjeta" style="max-width:420px;margin:0 auto;">
    <h2>Cambiar contraseña</h2>
    <p class="texto-suave">La contraseña nueva debe tener al menos 8 caracteres.</p>
    <form id="form-clave">
      <label for="actual">Contraseña actual</label>
      <input type="password" id="actual" autocomplete="current-password" required>
      <label for="nueva">Contraseña nueva</label>
      <input type="password" id="nueva" minlength="8" autocomplete="new-password" required>
      <label for="repetir">Repite la contraseña nueva</label>
      <input type="password" id="repetir" minlength="8" autocomplete="new-password" required>
      <button type="submit">Guardar contraseña</button>
    </form>
    <div id="mensaje"></div>
  </div>
  <div class="tarjeta" style="max-width:420px;margin:16px auto 0;">
    <h2>Cómo quiero recibir mis avisos</h2>
    <p class="texto-suave">Los avisos siempre aparecen en la app. Además te los podemos mandar por:</p>
    <form id="form-avisos">
      <label class="check"><input type="checkbox" id="avisar-correo"> Correo electrónico</label>
      <label class="check"><input type="checkbox" id="avisar-whatsapp"> WhatsApp (por ahora en modo prueba)</label>
      <label for="telefono">Teléfono</label>
      <input type="tel" id="telefono" placeholder="+56 9 1234 5678" autocomplete="tel">
      <button type="submit">Guardar preferencias</button>
    </form>
    <div id="mensaje-avisos"></div>
  </div>
</main>
<script src="js/api.js"></script>
<script src="js/cuenta.js"></script>
