<title>Crear cuenta - FeriaPlace</title>
<link rel="stylesheet" href="css/style.css">
<header>
  <a href="index.html">FeriaPlace</a>
  <nav id="nav-sesion"></nav>
</header>
<main>
  <div class="tarjeta" style="max-width:420px;margin:0 auto;">
    <h2>Crear cuenta de comerciante</h2>
    <p style="font-size:0.9rem;">Tu cuenta quedará pendiente hasta que el administrador la revise y la apruebe.</p>
    <form id="form-registro">
      <label for="nombre">Nombre</label>
      <input type="text" id="nombre" required>
      <label for="email">Email</label>
      <input type="email" id="email" required>
      <label for="password">Contraseña</label>
      <input type="password" id="password" minlength="6" required>
      <label for="telefono">Teléfono (opcional)</label>
      <input type="tel" id="telefono" maxlength="30">
      <label for="motivo">¿Qué quieres vender y por qué te interesa un puesto?</label>
      <textarea id="motivo" minlength="10" maxlength="500" rows="4" required placeholder="Ej: vendo verduras de mi huerta en Maipú y busco un puesto los fines de semana."></textarea>
      <button type="submit">Enviar solicitud de cuenta</button>
    </form>
    <div id="mensaje"></div>
    <p style="margin-top:16px;font-size:0.9rem;">¿Ya tienes cuenta? <a href="login.html">Inicia sesión</a></p>
  </div>
</main>
<script src="js/api.js"></script>
<script src="js/registro.js"></script>
